# dabbler.yaml -- what this repository declares about itself.
#
# Tracked, unlike local-overrides.yaml, because CI reads these facts and so
# does the next machine to pick up a session. Precedence is the packaged
# router-config.yaml, then this file, then local-overrides.yaml. Providers,
# models, roles and transports are deliberately absent: those are
# distribution facts, and a repository that restated them here would fork
# the model registry in order to say how to run a test suite.
schema_version: 1
posture: greenfield  # no tracked source or build file when bootstrap ran: the framework lays out new projects. Changing this word to maintenance changes it.

# One suite: Node's built-in test runner over tests/, with no dependencies
# to install. --test-timeout is the hang limit; its run is the run of record.
testing:
  suites:
    - name: node
      command: node --test --test-timeout=60000 "tests/**/*.test.js"
      expensive: true
      covers: [web, tests]
      test_roots: [tests]
      test_glob: "*.test.js"

# Step (f) of the lifecycle: pack, then push to a feed. A session that
# declared itself releasable publishes through these -- both argv, never
# shell strings, and `push` naming the credential rather than holding it.
# The pack tars web/ into one archive; the feed is a folder on disk, so the
# push copies the archive there with node and takes no credential (no
# `secret`). `dabbler packaging --dry-run` rehearses the block and exits 0
# when it loads, in a session that may not publish too;
# `dabbler packaging --rehearse` runs the pack and pushes nothing.
packaging:
  pack:
    argv: ["tar", "-czf", "{output}/daylight-clock.tar.gz", "-C", "web", "."]
  push:
    argv: ["node", "-e",
           "const fs=require('fs'),p=require('path');fs.mkdirSync(process.argv[2],{recursive:true});fs.copyFileSync(process.argv[1],p.join(process.argv[2],p.basename(process.argv[1])))",
           "{artifact}", "{feed}"]
    feed: 'D:\Releases\daylight-clock'
